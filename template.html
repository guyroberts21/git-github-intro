<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git &amp; GitHub: A Safety Net for Collaborative Work</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cstyle%3Epath%7Bfill:%23181717%7D@media (prefers-color-scheme:dark)%7Bpath%7Bfill:%23fff%7D%7D%3C/style%3E%3Cpath d='M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z'/%3E%3C/svg%3E">
<meta name="description" content="A 30-minute introduction to Git and GitHub for technical and non-technical people.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
html,body{margin:0;height:100%;background:#0B0F13;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#deck{position:relative;width:1920px;height:1080px;flex:none;transform-origin:center center;overflow:hidden}
h1,h2,h3,p,ul,ol,li,table{margin:0}
table{border-collapse:collapse}
th,td{text-align:left}
%%CSS%%
.flow{align-items:stretch}
.flow .arrow{align-self:center}
#deck>section{position:absolute;left:0;top:0;width:1920px;height:1080px;box-sizing:border-box;display:none}
#deck>section.active{display:flex;animation:fadein .35s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#ui{position:fixed;right:16px;bottom:12px;display:flex;gap:8px;align-items:center;font:14px Inter,Arial,sans-serif;color:#7D8A99;z-index:5}
#ui button{background:#18202A;color:#B9C4D0;border:1px solid #2B3644;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
#ui button:hover{background:#222C38}
@media print{
 @page{size:1920px 1080px;margin:0}
 html,body{overflow:visible;height:auto;background:none}
 #stage{position:static;display:block}
 #deck{width:auto;height:auto;transform:none!important;overflow:visible}
 #deck>section{position:relative;display:flex!important;page-break-after:always;animation:none}
 #ui{display:none}
}
</style>
</head>
<body>
<div id="stage"><main id="deck" aria-label="Slides">
%%SLIDES%%
</main></div>
<div id="ui"><button id="ui-prev" aria-label="Previous slide">&larr;</button><span id="ui-count"></span><button id="ui-next" aria-label="Next slide">&rarr;</button><button id="ui-full" aria-label="Full screen">Full screen</button></div>
<script>
(function(){
  var deck=document.getElementById('deck'),slides=[].slice.call(deck.children),i=0,count=document.getElementById('ui-count');
  function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);deck.style.transform='scale('+s+')';deck.style.margin=((1080*s-1080)/2)+'px '+((1920*s-1920)/2)+'px';}
  function show(n){i=Math.max(0,Math.min(slides.length-1,n));slides.forEach(function(s,k){s.classList.toggle('active',k===i)});count.textContent=(i+1)+' / '+slides.length;history.replaceState(null,'','#'+(i+1));}
  function go(d){show(i+d)}
  addEventListener('resize',fit);fit();
  var h=parseInt(location.hash.slice(1),10);show(isNaN(h)?0:h-1);
  addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '||e.key==='Enter'){e.preventDefault();go(1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'||e.key==='Backspace'){e.preventDefault();go(-1)}
    else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1);
    else if(e.key==='f'||e.key==='F')toggleFull();
  });
  function toggleFull(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}
  document.getElementById('ui-prev').onclick=function(){go(-1)};
  document.getElementById('ui-next').onclick=function(){go(1)};
  document.getElementById('ui-full').onclick=toggleFull;
  var x0=null;addEventListener('touchstart',function(e){x0=e.touches[0].clientX});
  addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)go(dx<0?1:-1);x0=null});
})();
</script>
</body>
</html>
